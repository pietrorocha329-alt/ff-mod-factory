name: Build Free Fire Mod

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25b

    - name: Compile C++ Menu
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-24
        make

    - name: Inject into APK (Python)
      run: |
        # Descompacta o split config
        unzip -o split_config.armeabi_v7a.apk -d work_split
        # Copia a lib compilada para dentro do jogo
        cp build/libffpay.so work_split/lib/armeabi-v7a/libffpay.so
        
        # Script Python para substituir a string sem usar patchelf
        python3 -c "
        import sys
        f = open('work_split/lib/armeabi-v7a/libil2cpp.so', 'r+b')
        data = f.read()
        # Procura por 'libanort.so' (uma lib que o FF usa) e troca por 'libffpay.so'
        target = b'libanort.so'
        replacement = b'libffpay.so\x00'
        idx = data.find(target)
        if idx != -1:
            f.seek(idx)
            f.write(replacement)
            print('Injetado com sucesso!')
        else:
            print('String original nao encontrada. Tentando libhermes.so')
            target = b'libhermes.so'
            replacement = b'libffpay.so\x00'
            idx = data.find(target)
            if idx != -1:
                f.seek(idx)
                f.write(replacement)
                print('Injetado com sucesso!')
        f.close()
        "
        
        # Empacota de novo
        cd work_split
        zip -r -X ../modded_split.apk .
        cd ..

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: modded-apk
        path: modded_split.apk
